name: Build Screen Recorder APK

on:
  push:
    paths:
      - "screenrecorder/**"
      - ".github/workflows/build-screen-recorder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screenrecorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository
      # secrets so every build is signed with the same key and updates install over older versions.
      # Without them the APK is signed with a throw-away debug key (still installable).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "No KEYSTORE_BASE64 secret set; signing with debug key"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NoExcuseRecorder.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: no-excuse-recorder-apk
          path: screenrecorder/NoExcuseRecorder.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recorder-v${{ github.run_number }}
          name: No Excuse Recorder v1.0.${{ github.run_number }}
          files: screenrecorder/NoExcuseRecorder.apk
