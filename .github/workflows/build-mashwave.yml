name: Build Mashwave APK

# Builds the Mashwave music/video player in the mashwave/ folder.
# The fitness app has its own workflow (build-apk.yml) and is not affected.
on:
  push:
    paths:
      - "mashwave/**"
      - ".github/workflows/build-mashwave.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mashwave
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Optional: with the MASHWAVE_KEYSTORE_BASE64 and MASHWAVE_KEYSTORE_PASSWORD repository
      # secrets set, the APK is signed with your own key and installs over earlier versions.
      # Without them it is signed with a throwaway key (see mashwave/README.md).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MASHWAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/mashwave-signing-key.jks
            echo "Signing with the repository's key"
          else
            echo "No signing key configured - using a throwaway debug key"
          fi

      - name: Build release APK
        env:
          MASHWAVE_KEYSTORE_PASSWORD: ${{ secrets.MASHWAVE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PappVersionName=1.0.${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk mashwave.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mashwave-apk
          path: mashwave/mashwave.apk

      # Published as a pre-release on purpose: the fitness app's updater reads this
      # repo's "latest release", and pre-releases never count as latest.
      - name: Publish download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mashwave-v${{ github.run_number }}
          name: Mashwave 1.0.${{ github.run_number }}
          prerelease: true
          make_latest: "false"
          files: mashwave/mashwave.apk
