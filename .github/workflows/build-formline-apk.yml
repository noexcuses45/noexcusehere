name: Build Formline APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["formline/**", ".github/workflows/build-formline-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms android --org com.noexcusehere --project-name formline .

      - name: Allow internet access
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          m = Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text()
          if "android.permission.INTERNET" not in t:
              t = t.replace("<application", '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          t = t.replace('android:label="formline"', 'android:label="Formline"')
          m.write_text(t)
          EOF

      - name: Use Gradle's own distribution server (GitHub mirror has been flaky)
        run: |
          f=android/gradle/wrapper/gradle-wrapper.properties
          v=$(grep -oE 'gradle-[0-9.]+-(all|bin)\.zip' "$f" | head -1 | sed -E 's/gradle-([0-9.]+)-.*/\1/')
          sed -i "s|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${v}-bin.zip|" "$f"
          cat "$f"

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: formline-apk
          path: formline/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish pre-release (over-the-air update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: formline-v${{ github.run_number }}
          name: Formline v1.0.${{ github.run_number }}
          prerelease: true
          files: formline/build/app/outputs/flutter-apk/app-release.apk
