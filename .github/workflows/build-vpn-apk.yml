name: Build VPN APK

# Builds Kestrel VPN (vpn-app/) only when its files change.
# The APK is attached to the workflow run as an artifact. It is deliberately NOT published
# as a GitHub Release: the fitness app's in-app updater installs whatever APK is on this
# repository's latest release, so a VPN release here would be offered to fitness-app users.
on:
  push:
    paths:
      - "vpn-app/**"
      - ".github/workflows/build-vpn-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional. With these repository secrets set, every build is signed with the same key,
      # so new versions install over old ones. Without them the APK is signed with a
      # throwaway key and the previous version has to be uninstalled first.
      - name: Restore signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.VPN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vpn-release.jks"
            echo "VPN_KEYSTORE_FILE=$RUNNER_TEMP/vpn-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Check, test and build
        env:
          VPN_KEYSTORE_PASSWORD: ${{ secrets.VPN_KEYSTORE_PASSWORD }}
          VPN_KEY_ALIAS: ${{ secrets.VPN_KEY_ALIAS }}
          VPN_KEY_PASSWORD: ${{ secrets.VPN_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-vpn-apk
          path: vpn-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
