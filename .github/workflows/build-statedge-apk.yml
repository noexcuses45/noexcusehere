name: Build StatEdge APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["statedge/**", ".github/workflows/build-statedge-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statedge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms android --org com.noexcusehere --project-name statedge .

      - name: Allow internet access
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          m = Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text()
          if "android.permission.INTERNET" not in t:
              t = t.replace("<application", '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
              m.write_text(t)
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: statedge-apk
          path: statedge/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish pre-release (over-the-air update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: statedge-v${{ github.run_number }}
          name: StatEdge v1.0.${{ github.run_number }}
          prerelease: true
          files: statedge/build/app/outputs/flutter-apk/app-release.apk
