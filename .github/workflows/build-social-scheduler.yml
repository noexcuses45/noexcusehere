name: Build Social Scheduler APK

# Tests and builds the app in social-scheduler/ whenever something there changes.
on:
  push:
    branches: [main, master, claude/social-media-scheduler-apk-qqybz7]
    paths:
      - "social-scheduler/**"
      - ".github/workflows/build-social-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-scheduler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publisher tests (simulated platform APIs)
        working-directory: social-scheduler/supabase/functions/scheduler
        run: |
          deno check index.ts
          deno test --allow-all tests/

      - name: Database schema tests
        working-directory: social-scheduler/supabase
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tests/run.sh

      - name: setup.sql is up to date with the migrations
        working-directory: social-scheduler/supabase
        run: |
          ./make-setup.sh
          git diff --exit-code -- setup.sql

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-scheduler
    steps:
      - uses: actions/checkout@v4

      # Same Java version the app was built and tested with.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned: this is the version the app was built and tested with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The signing key is private and lives in repository secrets
      # (SCHEDULER_KEYSTORE_BASE64, SCHEDULER_KEYSTORE_PASSWORD, SCHEDULER_KEY_ALIAS).
      # Without them the APK is still built, signed with a throwaway key, and no
      # release is published, because such a build could not update an installed copy.
      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHEDULER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCHEDULER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCHEDULER_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > android/key.properties
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set. This APK is signed with a throwaway key and cannot update an installed copy. See social-scheduler/README.md (Signing key)."
          fi

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/social-scheduler.apk

      # The release build strips resources it thinks are unused. The reminder
      # icon is only referenced by name, so make sure it is still in the APK.
      - name: Check the reminder icon is in the APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump resources build/social-scheduler.apk | grep -q "drawable/ic_stat_reminder"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: social-scheduler-apk
          path: social-scheduler/build/social-scheduler.apk

      # Releases are how installed copies find updates. The app looks for the
      # newest release tagged scheduler-v<N>.
      - name: Publish release (over-the-air update)
        if: steps.signing.outputs.configured == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scheduler-v${{ github.run_number }}
          name: Social Scheduler 1.0.${{ github.run_number }}
          files: social-scheduler/build/social-scheduler.apk
